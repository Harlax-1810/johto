[project]
name = "johto"
version = "0.1.0"
description = "Busywork automation for Mercor Project Johto pre-work tasks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
  "starlette==1.8.0",
  "uvicorn[standard]==0.54.0",
  "websockets==17.2",
  "watchfiles==1.3.0",
]

[project.scripts]
johto = "johto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
